name: nightly
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
    inputs:
      shards:
        description: 'Number of shards (sets the matrix size via shard_count; max 20)'
        default: '12'

env:
  SHARDS: ${{ inputs.shards || '12' }}

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - id: m
        run: |
          n=$SHARDS
          echo "matrix=$(python3 -c "import json;print(json.dumps(list(range($n))))")" >> "$GITHUB_OUTPUT"

  test:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: bazel-contrib/setup-bazel@0.15.0
        with:
          bazelisk-cache: true
          disk-cache: nightly-${{ matrix.shard }}
          repository-cache: true
      - name: Free disk space
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
      - name: Generate workspace
        run: |
          ci/setup.sh
          NIGHTLY_SHARD=${{ matrix.shard }}/$SHARDS GENERATE_ONLY=1 tools/run_nightly_master.sh
      - name: Test shard ${{ matrix.shard }}/${{ env.SHARDS }}
        run: |
          set -o pipefail
          NIGHTLY_SHARD=${{ matrix.shard }}/$SHARDS tools/run_nightly_master.sh --test_output=errors 2>&1 | tee nightly.log || true
      - name: Summarize
        if: always()
        run: |
          python3 tools/summarize_nightly.py nightly.log --json summary-${{ matrix.shard }}.json | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shard-${{ matrix.shard }}
          path: |
            nightly.log
            summary-${{ matrix.shard }}.json

  report:
    needs: test
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: shard-*
          merge-multiple: true
      - name: Merge summaries
        run: |
          python3 - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import glob, json, collections
          st = collections.Counter(); bad = []
          for f in sorted(glob.glob('summary-*.json')):
              d = json.load(open(f))
              for t, s in d['tests'].items():
                  st[s] += 1
                  if s not in ('PASSED', 'SKIPPED'): bad.append((s, t))
              bad += [('BUILD', e) for e in d.get('build_errors', [])]
          print('## Nightly (all shards)\n')
          print(', '.join(f'{k}: {v}' for k, v in sorted(st.items())) or 'no summaries found')
          print('\n### Not passing\n')
          for s, t in sorted(bad): print(f'- `{t}` {s}')
          PY
