name: nightly
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
    inputs:
      since_hours:
        description: 'Shortcut: only test what changed on the tracked branches in the last N hours (+ downstream). 0 = the full suite (the default, like the real nightly).'
        default: '0'
      max_shards:
        description: 'Maximum number of test shards (jobs) per RMW'
        default: '12'
      rmws:
        description: 'Space-separated RMW implementations to run the suite against'
        default: 'rmw_fastrtps_cpp rmw_cyclonedds_cpp rmw_zenoh_cpp'
      slim:
        description: 'Slim @rosdistro//:ament_package (drop the undeclared opencv/Ogre/pip bundle from every package)'
        default: true
        type: boolean

env:
  GH_TOKEN: ${{ github.token }}  # tools resolve master SHAs / recent commits with `gh api`
  MM_CACHE: ${{ github.workspace }}/.mm_cache
  SINCE_HOURS: ${{ inputs.since_hours || '0' }}
  SLIM_ROSDISTRO: ${{ (github.event_name == 'schedule' || inputs.slim) && '1' || '' }}

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      count: ${{ steps.plan.outputs.count }}
      shards: ${{ steps.plan.outputs.shards }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: bazel-contrib/setup-bazel@0.15.0
        with:
          bazelisk-cache: true
          repository-cache: true
      # Source tarballs are keyed by commit SHA, so only repos that changed since the last run download.
      - uses: actions/cache@v4
        with:
          path: .mm_cache
          key: mm-cache-${{ github.run_id }}
          restore-keys: mm-cache-
      - name: Generate master registry and select targets
        run: |
          ci/setup.sh
          [ "$SINCE_HOURS" = "0" ] && unset SINCE_HOURS
          GENERATE_ONLY=1 tools/run_nightly_master.sh
      - id: plan
        env:
          MAX_SHARDS: ${{ inputs.max_shards || '12' }}
          RMWS: ${{ inputs.rmws || 'rmw_fastrtps_cpp rmw_cyclonedds_cpp rmw_zenoh_cpp' }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, math, os
          n = len([l for l in open('ros-central-registry/workspace/nightly-targets.txt') if l.strip()])
          full = os.environ.get('SINCE_HOURS', '0') == '0'
          per = 30 if full else 80   # full list is package patterns, the selected list is test targets
          k = 0 if n == 0 else max(1, min(int(os.environ['MAX_SHARDS']), math.ceil(n / per)))
          rmws = os.environ['RMWS'].split()
          # the lint tests do not depend on the RMW: run them with the first one only
          inc = [{'shard': i, 'rmw': r, 'lint': r == rmws[0]} for r in rmws for i in range(k)]
          print(f"count={n}\nshards={k}\nmatrix={json.dumps(inc)}")
          PY
          echo "### Plan" >> "$GITHUB_STEP_SUMMARY"
          { echo "since_hours=$SINCE_HOURS slim=${SLIM_ROSDISTRO:-0}"; echo; echo "changed:"; cat ros-central-registry/workspace/changed.txt 2>/dev/null | sed 's/^/- /'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: prepared
          path: |
            master-registry
            ros-central-registry/workspace/nightly-targets.txt
            gen_all.log
          retention-days: 3

  test:
    needs: prepare
    if: needs.prepare.outputs.count != '0'
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: bazel-contrib/setup-bazel@0.15.0
        with:
          bazelisk-cache: true
          disk-cache: nightly-${{ matrix.shard }}
          repository-cache: true
      - name: BuildBuddy
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: ci/buildbuddy.sh
      - name: Free disk space
        # not the Android SDK: ANDROID_HOME points at it and Bazel's rules_android fails if it is gone
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/download-artifact@v4
        with:
          name: prepared
          path: prepared
      - name: Test shard ${{ matrix.shard }}/${{ needs.prepare.outputs.shards }} (${{ matrix.rmw }})
        env:
          SINCE_HOURS: ''  # selection already done in prepare
          NIGHTLY_RMW: ${{ matrix.rmw }}
        run: |
          set -o pipefail
          ci/setup.sh
          mv prepared/master-registry .
          SKIP_GENERATE=1 NIGHTLY_TARGETS=prepared/ros-central-registry/workspace/nightly-targets.txt \
            NIGHTLY_SHARD=${{ matrix.shard }}/${{ needs.prepare.outputs.shards }} \
            tools/run_nightly_master.sh --test_output=errors --nocache_test_results --jobs=128 --test_env=RMW_IMPLEMENTATION=${{ matrix.rmw }} ${{ !matrix.lint && '--test_tag_filters=-lint' || '' }} 2>&1 | tee nightly.log || true
      - name: Summarize
        if: always()
        run: |
          python3 tools/summarize_nightly.py nightly.log --json summary-${{ matrix.rmw }}-${{ matrix.shard }}.json | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Collect per-case results
        if: always()
        run: |
          python3 tools/collect_cases.py ros-central-registry/workspace/bazel-testlogs/. cases-${{ matrix.rmw }}-${{ matrix.shard }}.json failed-logs-${{ matrix.rmw }}-${{ matrix.shard }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shard-${{ matrix.rmw }}-${{ matrix.shard }}
          path: |
            nightly.log
            summary-${{ matrix.rmw }}-${{ matrix.shard }}.json
            cases-${{ matrix.rmw }}-${{ matrix.shard }}.json
            failed-logs-${{ matrix.rmw }}-${{ matrix.shard }}
            zenohd.log

  report:
    needs: [prepare, test]
    if: always() && needs.prepare.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: shard-*
          merge-multiple: true
      - name: Merge summaries
        run: |
          python3 - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import glob, json, collections, re
          res = collections.defaultdict(dict)   # rmw -> target -> status
          build = collections.defaultdict(list)
          for f in sorted(glob.glob('summary-*.json')):
              rmw = re.match(r'summary-(.+)-\d+\.json', f).group(1)
              d = json.load(open(f))
              res[rmw].update(d['tests'])
              build[rmw] += d.get('build_errors', [])
          print('## Nightly\n')
          ok = ('PASSED', 'SKIPPED')
          bad = {r: {t for t, s in ts.items() if s not in ok} for r, ts in res.items()}
          for r, ts in sorted(res.items()):
              c = collections.Counter(ts.values())
              print(f'- **{r}**: ' + ', '.join(f'{k}: {v}' for k, v in sorted(c.items())) + f', build errors: {len(build[r])}')
          if not res: print('nothing to test (no changes in the window) or no summaries')
          allbad = set().union(*bad.values()) if bad else set()
          common = set.intersection(*bad.values()) if bad else set()
          print('\n### Fails on every RMW\n')
          for t in sorted(common): print(f'- `{t}`')
          print('\n### RMW-specific failures\n')
          for t in sorted(allbad - common):
              print(f'- `{t}`: fails on ' + ', '.join(sorted(r for r in bad if t in bad[r])))
          for r in build:
              for e in build[r]: print(f'- BUILD ({r}) {e}')
          PY
